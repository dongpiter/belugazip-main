kind = "web"
previewPath = "/"
title = "BELUGA Catering"
version = "1.0.0"
id = "artifacts/beluga-catering"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22236

[services.development]
run = "pnpm --filter @workspace/beluga-catering run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beluga-catering", "run", "build" ]
publicDir = "artifacts/beluga-catering/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22236"
BASE_PATH = "/"
